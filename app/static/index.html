<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片上传</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 40px;
            width: 100%;
            max-width: 560px;
        }

        h1 {
            font-size: 22px;
            color: #1a1a1a;
            margin-bottom: 28px;
            text-align: center;
        }

        /* 拖拽上传区域 */
        .drop-zone {
            border: 2px dashed #d0d5dd;
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: #4f7cf7;
            background: #f5f8ff;
        }

        .drop-zone-icon {
            font-size: 40px;
            color: #98a2b3;
            margin-bottom: 10px;
        }

        .drop-zone-text {
            color: #667085;
            font-size: 14px;
            line-height: 1.6;
        }

        .drop-zone-text span {
            color: #4f7cf7;
            font-weight: 500;
        }

        .drop-zone input[type="file"] {
            display: none;
        }

        /* 图片预览 */
        .preview-wrapper {
            display: none;
            margin-top: 16px;
            position: relative;
        }

        .preview-wrapper img {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 8px;
            background: #f9fafb;
        }

        .preview-info {
            margin-top: 8px;
            font-size: 13px;
            color: #667085;
        }

        .preview-remove {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 文字提示输入 */
        .form-group {
            margin-top: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #344054;
            margin-bottom: 6px;
        }

        .form-group textarea {
            width: 100%;
            min-height: 90px;
            padding: 10px 14px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group textarea:focus {
            border-color: #4f7cf7;
            box-shadow: 0 0 0 3px rgba(79, 124, 247, 0.15);
        }

        /* 提交按钮 */
        .submit-btn {
            margin-top: 24px;
            width: 100%;
            padding: 12px;
            background: #4f7cf7;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover { background: #3b66d9; }
        .submit-btn:disabled { background: #a4bffa; cursor: not-allowed; }

        /* 进度条 */
        .progress-bar {
            display: none;
            margin-top: 16px;
            height: 6px;
            background: #e4e7ec;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #4f7cf7;
            border-radius: 3px;
            transition: width 0.2s;
        }

        /* 结果展示 */
        .result {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.7;
            word-break: break-all;
        }

        .result.success {
            background: #ecfdf3;
            border: 1px solid #a6f4c5;
            color: #065f46;
        }

        .result.error {
            background: #fef3f2;
            border: 1px solid #fecdca;
            color: #912018;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>图片 & 提示上传</h1>

        <!-- 拖拽上传区域 -->
        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">&#128247;</div>
            <div class="drop-zone-text">
                拖拽图片到此处，或 <span>点击选择文件</span><br>
                支持 JPG / PNG / GIF / WebP，最大 10 MB
            </div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <!-- 图片预览 -->
        <div class="preview-wrapper" id="previewWrapper">
            <img id="previewImg" src="" alt="预览">
            <button class="preview-remove" id="removeBtn">&times;</button>
            <div class="preview-info" id="previewInfo"></div>
        </div>

        <!-- 文字提示 -->
        <div class="form-group">
            <label for="prompt">文字提示</label>
            <textarea id="prompt" placeholder="请输入对图片的描述或指令..."></textarea>
        </div>

        <!-- 提交按钮 -->
        <button class="submit-btn" id="submitBtn">上传</button>

        <!-- 进度条 -->
        <div class="progress-bar" id="progressBar">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>

        <!-- 结果 -->
        <div class="result" id="result"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewWrapper = document.getElementById('previewWrapper');
        const previewImg = document.getElementById('previewImg');
        const previewInfo = document.getElementById('previewInfo');
        const removeBtn = document.getElementById('removeBtn');
        const prompt = document.getElementById('prompt');
        const submitBtn = document.getElementById('submitBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const result = document.getElementById('result');

        let selectedFile = null;

        // 点击选择文件
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        // 拖拽事件
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) handleFile(file);
        });

        // 处理文件选择
        function handleFile(file) {
            if (!file) return;
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                previewWrapper.style.display = 'block';
                dropZone.style.display = 'none';
                const sizeMB = (file.size / 1024 / 1024).toFixed(2);
                previewInfo.textContent = `${file.name}  (${sizeMB} MB)`;
            };
            reader.readAsDataURL(file);
        }

        // 移除预览
        removeBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            previewWrapper.style.display = 'none';
            dropZone.style.display = 'block';
            result.style.display = 'none';
        });

        // 提交上传
        submitBtn.addEventListener('click', () => {
            if (!selectedFile) { alert('请先选择一张图片'); return; }
            if (!prompt.value.trim()) { alert('请输入文字提示'); return; }

            const formData = new FormData();
            formData.append('image', selectedFile);
            formData.append('prompt', prompt.value.trim());

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/upload');

            // 显示进度条
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';
            submitBtn.disabled = true;
            result.style.display = 'none';

            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    progressFill.style.width = Math.round((e.loaded / e.total) * 100) + '%';
                }
            });

            xhr.addEventListener('load', () => {
                submitBtn.disabled = false;
                progressBar.style.display = 'none';
                result.style.display = 'block';

                if (xhr.status === 200) {
                    const data = JSON.parse(xhr.responseText);
                    result.className = 'result success';
                    result.innerHTML =
                        `<strong>上传成功</strong><br>` +
                        `文件 ID: ${data.file_id}<br>` +
                        `文件名: ${data.filename}<br>` +
                        `大小: ${(data.size / 1024).toFixed(1)} KB<br>` +
                        `提示: ${data.prompt}`;
                } else {
                    const err = JSON.parse(xhr.responseText);
                    result.className = 'result error';
                    result.innerHTML = `<strong>上传失败</strong><br>${err.detail || '未知错误'}`;
                }
            });

            xhr.addEventListener('error', () => {
                submitBtn.disabled = false;
                progressBar.style.display = 'none';
                result.style.display = 'block';
                result.className = 'result error';
                result.innerHTML = '<strong>网络错误</strong><br>请检查网络连接后重试';
            });

            xhr.send(formData);
        });
    </script>
</body>
</html>
